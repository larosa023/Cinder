<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cinder Remote</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root { --bg: #0b0d12; --el: #12151c; --sf: #181c25; --sh: #202533; --bd: #262b38; --tx: #e8ebf2; --dim: #8b93a7; --ac: #ff6a3d; --ok: #3ddc97; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom)); min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: var(--tx); }
[hidden] { display: none !important; }
header { position: sticky; top: 0; z-index: 5; padding: 14px 16px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 12px var(--ac); }
.brand small { margin-left: auto; color: var(--dim); font-weight: 500; }
.np { margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: linear-gradient(90deg, rgba(61,220,151,.18), var(--sf)); }
.np img { width: 74px; aspect-ratio: 460/215; object-fit: cover; border-radius: 8px; }
.np b { display: block; }
.np small { color: var(--ok); font-weight: 600; }
.search { margin-top: 10px; display: flex; gap: 8px; }
.search input { flex: 1; height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--bd); background: var(--sf); outline: none; }
.search input:focus { border-color: var(--ac); }
.chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
.chips button { flex: none; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--sf); color: var(--dim); font-weight: 600; font-size: 14px; }
.chips button.on { background: var(--ac); color: #fff; }
main { padding: 4px 16px 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.card { text-align: left; }
.card .art { position: relative; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: var(--sf); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .art span { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; font-weight: 700; font-size: 13px; color: var(--dim); }
.card .tag { position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--ac); color: #fff; }
.card.ni img { filter: grayscale(.8) brightness(.6); }
.card b { display: block; font-size: 13px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { color: var(--dim); font-size: 12px; }
.dl { display: flex; flex-direction: column; gap: 10px; }
.drow { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: var(--sf); }
.drow img { width: 84px; aspect-ratio: 460/215; object-fit: cover; border-radius: 8px; }
.drow b { display: block; font-size: 14px; }
.drow small { color: var(--dim); font-size: 12px; }
.bar { height: 5px; border-radius: 9px; background: var(--bd); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ac); }
.btn { height: 44px; padding: 0 18px; border-radius: 12px; background: var(--sh); font-weight: 700; }
.btn.pri { background: var(--ac); color: #fff; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; }
.row { display: flex; gap: 8px; margin: 4px 0 14px; }
.empty { color: var(--dim); text-align: center; padding: 40px 10px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--el) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--bd); }
nav button { flex: 1; height: 48px; border-radius: 12px; color: var(--dim); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
nav button.on { color: var(--tx); background: var(--sf); }
nav em { font-style: normal; font-size: 11px; background: var(--ac); color: #fff; border-radius: 99px; padding: 1px 7px; }
.sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .2s; }
.sheet-bg.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; padding: 0 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: var(--el);
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.sheet .hero { margin: 0 -16px 14px; aspect-ratio: 460/215; background: var(--sf) center/cover; border-radius: 22px 22px 0 0; }
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet p { margin: 0 0 14px; color: var(--dim); font-size: 14px; }
.sheet .btns { display: flex; flex-direction: column; gap: 8px; }
.sheet .btn { height: 52px; font-size: 16px; }
.pair { min-height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; gap: 14px; }
.pair h1 { margin: 0; font-size: 26px; }
.pair p { color: var(--dim); margin: 0; max-width: 300px; }
.pin { width: 230px; height: 64px; text-align: center; font-size: 32px; letter-spacing: .3em; border-radius: 16px; border: 2px solid var(--bd); background: var(--sf); outline: none; }
.pin:focus { border-color: var(--ac); }
.err { color: #ff6a6a; font-size: 14px; min-height: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; padding: 10px 16px; border-radius: 12px; background: var(--sh); font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<section class="pair" id="pair" hidden>
  <div class="brand" style="font-size:20px"><i></i>Cinder</div>
  <h1>Pair this phone</h1>
  <p>On your PC, open Cinder → Settings → Phone remote and type the 6-digit code shown there.</p>
  <input class="pin" id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
  <div class="err" id="perr"></div>
  <button class="btn pri" id="pgo">Pair</button>
</section>

<div id="app" hidden>
  <header>
    <div class="brand"><i></i>Cinder <small id="steam"></small></div>
    <div class="np" id="np" hidden></div>
    <div id="libtools">
      <div class="search"><input id="q" type="search" placeholder="Search your games" autocomplete="off"></div>
      <div class="chips" id="chips">
        <button data-f="installed" class="on">Installed</button><button data-f="recent">Recent</button><button data-f="updates">Updates</button><button data-f="all">All</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <nav><button data-tab="library" class="on">Library</button><button data-tab="downloads">Downloads <em id="dlc" hidden></em></button></nav>
</div>
<div class="sheet-bg" id="sbg" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const R = { games: [], status: {}, dl: null, tab: "library", f: "installed", q: "" };

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Remote": "1" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { showPair(); throw new Error("pair"); }
  const d = await r.json();
  if (d.ok === false && d.error) throw new Error(d.error);
  return d;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const hm = (m) => (m >= 60 ? `${Math.round(m / 6) / 10} h` : m ? `${m} min` : "Not played");
const pct = (d) => (d.total ? Math.round((100 * d.done) / d.total) : d.stage_total ? Math.round((100 * d.stage_done) / d.stage_total) : 0);

function showPair() { $("#app").hidden = true; $("#pair").hidden = false; setTimeout(() => $("#pin").focus(), 100); }
async function pair() {
  $("#perr").textContent = "";
  const pin = $("#pin").value.replace(/\D/g, "");
  if (pin.length !== 6) { $("#perr").textContent = "The code has 6 digits"; return; }
  const name = /iPhone/.test(navigator.userAgent) ? "iPhone" : /iPad/.test(navigator.userAgent) ? "iPad" : /Android/.test(navigator.userAgent) ? "Android phone" : "Browser";
  try {
    const r = await fetch("/pair", { method: "POST", headers: { "Content-Type": "application/json", "X-Remote": "1" }, body: JSON.stringify({ pin, name }) });
    const d = await r.json();
    if (!d.ok) { $("#perr").textContent = d.error; return; }
    $("#pair").hidden = true;
    start();
  } catch { $("#perr").textContent = "Couldn't reach Cinder. Is the PC on?"; }
}

async function start() {
  try {
    const [lib, st] = await Promise.all([api("/r/library"), api("/r/status")]);
    R.games = lib.games; R.status = st.steam || {};
  } catch (e) { if (e.message !== "pair") toast(e.message); return; }
  $("#app").hidden = false;
  render();
  setInterval(tick, 5000);
}
async function tick() {
  if (document.hidden) return;
  try {
    R.status = (await api("/r/status")).steam || {};
    if (R.tab === "downloads") R.dl = await api("/r/downloads");
    head(); if (R.tab === "downloads") body();
  } catch { /* offline for a moment */ }
}

function head() {
  const s = R.status, p = s.playing;
  $("#steam").textContent = s.running ? "Steam running" : "Steam closed";
  const np = $("#np");
  np.hidden = !p;
  if (p) {
    const mins = Math.floor((Date.now() / 1000 - p.since) / 60);
    np.innerHTML = `<img alt="" src="/art/${p.appid}/header"><div><small>Now playing · ${mins} min</small><b>${esc(p.name)}</b></div>`;
  }
  const n = s.downloads || 0;
  $("#dlc").hidden = !n; $("#dlc").textContent = n;
  $("#libtools").hidden = R.tab !== "library";
}

function list() {
  let g = R.games;
  const q = R.q.toLowerCase();
  if (q) g = g.filter((x) => x.name.toLowerCase().includes(q));
  if (R.f === "installed") g = g.filter((x) => x.installed);
  if (R.f === "updates") g = g.filter((x) => x.update_pending || x.download);
  if (R.f === "recent") g = g.filter((x) => x.lastplayed).sort((a, b) => b.lastplayed - a.lastplayed).slice(0, 30);
  else g = [...g].sort((a, b) => a.name.localeCompare(b.name));
  return g;
}

function body() {
  const m = $("#main");
  if (R.tab === "library") {
    const g = list();
    m.innerHTML = g.length ? `<div class="grid">${g.map((x) => `
      <button class="card${x.installed ? "" : " ni"}" data-app="${x.appid}">
        <div class="art"><span>${esc(x.name)}</span><img alt="" loading="lazy" src="/art/${x.appid}/portrait" onerror="this.remove()">
          ${x.download ? `<i class="tag">${pct(x.download)}%</i>` : x.update_pending ? '<i class="tag">Update</i>' : ""}</div>
        <b>${esc(x.name)}</b><small>${x.installed ? hm(x.playtime) : "Not installed"}</small>
      </button>`).join("")}</div>` : '<div class="empty">No games here.</div>';
    return;
  }
  const d = R.dl;
  if (!d) { m.innerHTML = '<div class="empty">Loading…</div>'; return; }
  const items = (d.items || []).filter((x) => x.state !== "done");
  m.innerHTML = `<div class="row"><button class="btn sm" data-dl="pause_all">Pause all</button><button class="btn sm" data-dl="resume_all">Resume all</button></div>
    <div class="dl">${items.map((x) => `
      <div class="drow"><img alt="" src="/art/${x.appid}/header" onerror="this.style.visibility='hidden'">
        <div><b>${esc(x.name)}</b><small>${esc({ downloading: "Downloading", installing: "Installing", verifying: "Verifying", queued: "Queued", paused: "Paused" }[x.state] || x.state)} · ${pct(x)}%</small>
          <div class="bar"><i style="width:${pct(x)}%"></i></div></div>
        <button class="btn sm" data-dl="${x.state === "paused" ? "resume" : "pause"}" data-id="${x.appid}">${x.state === "paused" ? "Resume" : "Pause"}</button>
      </div>`).join("") || '<div class="empty">Nothing downloading.</div>'}</div>
    ${(d.updates || []).length ? `<h3 style="margin:22px 0 10px">Updates ready</h3><div class="dl">${d.updates.map((u) => `
      <div class="drow"><img alt="" src="/art/${u.appid}/header" onerror="this.style.visibility='hidden'"><div><b>${esc(u.name)}</b><small>Update available</small></div>
        <button class="btn sm pri" data-upd="${u.appid}">Update</button></div>`).join("")}</div>` : ""}`;
}
function render() { head(); body(); }

function openSheet(appid) {
  const g = R.games.find((x) => x.appid === appid);
  if (!g) return;
  const sh = $("#sheet"), bg = $("#sbg");
  sh.innerHTML = `<div class="hero" style="background-image:url('/art/${g.appid}/header')"></div>
    <h2>${esc(g.name)}</h2><p>${g.installed ? `${hm(g.playtime)} played` : "Not installed"}${g.download ? ` · ${pct(g.download)}% downloaded` : ""}</p>
    <div class="btns">
      ${g.installed ? `<button class="btn pri" data-act="launch">▶ Play on PC</button>` : `<button class="btn pri" data-act="install">Install on PC</button>`}
      ${g.installed && g.update_pending && !g.shortcut ? '<button class="btn" data-act="update">Update</button>' : ""}
      <button class="btn" data-close>Close</button></div>`;
  sh.dataset.app = appid;
  sh.hidden = bg.hidden = false;
  requestAnimationFrame(() => { sh.classList.add("open"); bg.classList.add("open"); });
}
function closeSheet() {
  const sh = $("#sheet"), bg = $("#sbg");
  sh.classList.remove("open"); bg.classList.remove("open");
  setTimeout(() => { sh.hidden = bg.hidden = true; }, 260);
}

document.addEventListener("click", async (e) => {
  const t = e.target;
  const tab = t.closest("[data-tab]");
  if (tab) {
    R.tab = tab.dataset.tab;
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b === tab));
    if (R.tab === "downloads") { R.dl = null; render(); R.dl = await api("/r/downloads").catch(() => ({ items: [] })); }
    return render();
  }
  const f = t.closest("[data-f]");
  if (f) { R.f = f.dataset.f; document.querySelectorAll("#chips button").forEach((b) => b.classList.toggle("on", b === f)); return body(); }
  const card = t.closest("[data-app]");
  if (card) return openSheet(+card.dataset.app);
  if (t.closest("[data-close]") || t.id === "sbg") return closeSheet();
  const act = t.closest("[data-act]");
  if (act) {
    const appid = +$("#sheet").dataset.app;
    try {
      await api("/r/action", { action: act.dataset.act, appid });
      toast({ launch: "Starting on your PC…", install: "Install started in Steam", update: "Update started" }[act.dataset.act]);
      closeSheet();
    } catch (err) { toast(err.message); }
    return;
  }
  const dl = t.closest("[data-dl]");
  if (dl) {
    try { await api("/r/action", { action: "download", cmd: dl.dataset.dl, appid: dl.dataset.id ? +dl.dataset.id : undefined }); toast("Done"); }
    catch (err) { toast(err.message); }
    setTimeout(tick, 800); return;
  }
  const up = t.closest("[data-upd]");
  if (up) { try { await api("/r/action", { action: "update", appid: +up.dataset.upd }); toast("Update started"); } catch (err) { toast(err.message); } setTimeout(tick, 1500); }
});
$("#q").addEventListener("input", (e) => { R.q = e.target.value.trim(); body(); });
$("#pgo").addEventListener("click", pair);
$("#pin").addEventListener("keydown", (e) => { if (e.key === "Enter") pair(); });
$("#pin").addEventListener("input", (e) => { if (e.target.value.replace(/\D/g, "").length === 6) pair(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#app").hidden) tick(); });
start();
</script>
</body>
</html>
